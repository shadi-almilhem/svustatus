name: Scheduled Status Check

on:
  workflow_dispatch:
  schedule:
    # Twice-hourly legacy fallback for status-data branch consumers. Production
    # reads the self-healing Cloudflare Worker/KV pipeline.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  status-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check status data freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const outputPath = process.env.GITHUB_OUTPUT;
          const url = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/status-data/status.json?ts=${Date.now()}`;
          let shouldRun = true;
          let reason = "no existing status data";

          try {
            const response = await fetch(url, { cache: "no-store" });
            if (response.ok) {
              const payload = await response.json();
              const generatedAt = new Date(payload.generatedAt).getTime();
              const ageMinutes = (Date.now() - generatedAt) / 60_000;
              shouldRun = !Number.isFinite(generatedAt) || ageMinutes >= 25;
              reason = Number.isFinite(generatedAt)
                ? `latest status data is ${Math.round(ageMinutes)} minutes old`
                : "latest status data has an invalid timestamp";
            } else {
              reason = `status data request returned ${response.status}`;
            }
          } catch (error) {
            reason = error instanceof Error ? error.message : "unknown freshness error";
          }

          appendFileSync(outputPath, `should_run=${shouldRun}\n`);
          appendFileSync(outputPath, `reason=${reason.replaceAll("\n", " ")}\n`);
          console.log(`${shouldRun ? "Running" : "Skipping"} checks: ${reason}`);
          NODE

      - name: Restore status data branch
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status-data
          cd status-data
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY"
          if git ls-remote --exit-code --heads origin status-data >/dev/null 2>&1; then
            git fetch origin status-data --depth=1
            git checkout status-data
          else
            git checkout --orphan status-data
            rm -rf ./*
          fi

      - name: Export Cloudflare measurements
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.118.0 d1 execute svustatus-watch \
            --remote \
            --config app/wrangler.status.toml \
            --command "SELECT monitor_id, checked_at, url, ok, status, latency_ms, attempt, error FROM status_checks WHERE checked_at >= strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-46 days') ORDER BY checked_at" \
            --json > status-data/cloudflare-checks.json; then
            echo "::warning::Cloudflare measurements could not be exported; retaining existing history."
            echo '[]' > status-data/cloudflare-checks.json
          fi

      - name: Run status checks
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          node app/scripts/check-status.mjs \
            --config app/monitor.config.json \
            --input status-data/status.json \
            --history-input status-data/cloudflare-checks.json \
            --output status-data/status.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('status-data/status.json','utf8')); if (!Array.isArray(data.monitors) || data.monitors.length !== 5) throw new Error('Expected 5 monitors in status.json');"

      - name: Publish status data
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No status data changes to publish."
            exit 0
          fi
          git commit -m "Update status data"
          git push origin HEAD:status-data
