# Builds the Vite app and deploys static assets to Cloudflare Pages (Direct Upload / CI).
#
# Required secrets for this workflow (choose ONE place to store them):
#
# A) Repository secrets (simplest — no GitHub “Environment” needed)
#    Repo → Settings → Secrets and variables → Actions → “Repository secrets”
#    → New repository secret:
#      - CLOUDFLARE_API_TOKEN — https://dash.cloudflare.com/profile/api-tokens
#        Use “Edit Cloudflare Workers”, or a custom token with both
#        Account → Cloudflare Pages → Edit and Workers Scripts → Edit.
#      - CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard → Account home → Account ID
#
# B) Environment secrets (optional — if you use job.environment below)
#    Repo → Settings → Environments → create an environment (e.g. cloudflare-pages)
#    → add the same two names there, and uncomment `environment:` on the deploy job.
#
# Do not put these values in .env.production or any committed file.
#
# If your Cloudflare Pages project name differs, change the project name in wrangler.toml
# and in the deploy step.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Uncomment the next line if CLOUDFLARE_* secrets are stored under
    # Settings → Environments → <name> (Environment secrets), not repository secrets.
    # environment: cloudflare-pages
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            pnpm import
          fi
          pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_STATUS_DATA_URL: /api/status
        run: pnpm run build

      - name: Deploy dynamic OG JPEG renderer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.og.toml

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=svustatus --branch=main

      - name: Ensure status queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm exec wrangler queues info svustatus-checks --config wrangler.status.toml; then
            pnpm exec wrangler queues create svustatus-checks --config wrangler.status.toml
          fi

      - name: Deploy hourly status Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.status.toml
